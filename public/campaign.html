<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8b3d60"><title>Campanha · Doce Casa</title><link rel="stylesheet" href="/styles.css"></head><body class="public-page"><header class="store-header"><div class="container header-inner"><a class="brand" href="/" aria-label="Doce Casa"><span class="brand-mark">D</span><span><strong>Doce Casa</strong><small>campanha</small></span></a></div></header><main class="container" style="padding:32px 0 64px"><section id="campaign-info" class="panel"><div class="eyebrow">CAMPANHA</div><h1 id="campaign-name">Carregando…</h1><p id="campaign-description"></p><div id="campaign-dates"></div></section><section id="catalog-area" class="panel" style="margin-top:18px"><div class="section-heading"><div><span class="eyebrow">CATÁLOGO</span><h2>Produtos disponíveis</h2></div></div><div id="campaign-products" class="product-grid"></div><div id="campaign-cart" style="margin-top:22px"></div></section><section class="panel" style="margin-top:18px"><div class="section-heading"><div><span class="eyebrow">PEDIDO</span><h2>Fazer pedido</h2></div></div><form id="campaign-order-form" class="form-grid"><label>Nome<input name="name" required></label><label>WhatsApp<input name="phone" required></label><label>Número do cliente <span class="optional">opcional</span><input name="number"></label><label>Endereço de entrega <span class="optional">opcional</span><input name="address"></label><label>E-mail <span class="optional">opcional</span><input name="email" type="email"></label><label style="grid-column:1/-1">Observações<textarea name="notes" rows="3"></textarea></label><p id="order-error" class="form-error" style="grid-column:1/-1"></p><button class="primary-button full" type="submit" style="grid-column:1/-1">Enviar pedido</button></form></section><section class="panel" style="margin-top:18px"><div class="section-heading"><div><span class="eyebrow">CONSULTA</span><h2>Consultar meu pedido</h2></div></div><form id="lookup-form" class="form-grid"><label>Número do pedido<input name="number" placeholder="CAM-20260908-ABC123" required></label><label>Telefone<input name="phone" required></label><label>Código de acesso <span class="optional">se disponível</span><input name="code"></label><button class="secondary-button full" type="submit" style="grid-column:1/-1">Consultar</button></form><div id="order-result" style="margin-top:18px"></div></section></main><script src="/campaign.js"></script></body></html>
